; =============================================================================
; PlatformIO project configuration
;
; ONE BOARD, TWO ROLES: the Seeed XIAO ESP32C5. Same board, same carrier, same
; pin map — `xiao_c5_primary` vs `xiao_c5` is only which program gets compiled
; (build_src_filter) and whether -DDUSTGATE_SECONDARY is set.
; =============================================================================

[platformio]
src_dir   = firmware
data_dir  = firmware/data
default_envs = xiao_c5_primary
; Keep build output and library deps in .nosync directories so macOS iCloud
; Drive ignores them entirely. iCloud blocks small rapid writes (GCC .d dep
; files, SCons .sconsign tmp files) on synced folders in the project path.
build_dir   = .pio.nosync/build
libdeps_dir = .pio.nosync/libdeps

; -----------------------------------------------------------------------------
; Shared across both environments. Only the program and the partition table
; differ per role, below.
; -----------------------------------------------------------------------------
[env]
; THE PIOARDUINO FORK, not `espressif32`, which has no ESP32-C5. Arduino core 3.x
; / IDF 5.x. It builds against its own PLATFORMIO_CORE_DIR — dev.sh and deploy.sh
; set it via use_core_for_env(); by hand:
;
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run -e xiao_c5_primary
;
; CI uses the runner's default core dir. ~/.platformio holds an unused official
; installation and can be deleted.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board     = seeed_xiao_esp32c5

; Serial monitor — matches SERIAL_BAUD in config.h
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; USB Serial/JTAG: DTR/RTS are the ROM's download-mode trigger, not line state.
; Assert them and the board drops into the bootloader and prints nothing, which
; looks exactly like a dead board. Hold both LOW.
monitor_dtr = 0
monitor_rts = 0

; Core 3.x versions — the me-no-dev AsyncTCP/ESPAsyncWebServer and ESP32Servo 1.x
; line does not survive the jump. TMCStepper/AccelStepper are absent and must stay
; absent: nothing in this tree generates steps any more — the rack is a serial
; bus servo, and a build asking for them is a build that resurrected something.
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    madhephaestus/ESP32Servo@^3.0.5
    ; NodeLink transport. ESPAsyncWebServer is server-ONLY; a primary needs a
    ; WebSocket CLIENT to dial out to each secondary. Unused by a node, and
    ; cheap enough not to be worth a second lib_deps list to exclude.
    links2004/WebSockets@^2.4.1
    ; The status screen, on every target — a board header that names PIN_OLED_*
    ; gets the driver, and an I2C ACK at 0x3C at boot decides whether a panel is
    ; really there. Costs ~21 KB of flash and ~300 bytes of RAM; the 1 KB
    ; framebuffer is only allocated after a real ACK. Both libraries are
    ; core-agnostic and a panel has run on a C5 through them (2026-08-22).
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

; LittleFS — Angular front-end bundle stored in firmware/data/
; Build bundle first:  cd dustgate-ui && bash deploy.sh
board_build.filesystem = littlefs

; Exclusions, each for its own reason:
;   test/        HOST conformance tests built with g++, each with its own main().
;                Run them with the tools/ scripts, not pio.
;   node/        the SEPARATE secondary-node program. The xiao_c5 env below
;                inverts this filter to build that instead.
;   bench/       bench programs, each with its own main() — same story. See the
;                xiao_c5_bus_bench env at the bottom.
build_src_filter = +<*> -<test/> -<node/> -<bench/> -<motor/st3215/>

; Extra script: serialises the build + clears dep-file flags to fix
; "opening dependency file: No such file or directory" on first builds.
extra_scripts = pre:extra_script.py

; belt-and-suspenders: also remove -MMD from any flag list where it appears
build_unflags = -MMD

; -----------------------------------------------------------------------------
; PRIMARY — the routing brain. Topology, REST API, the Angular bundle, Shelly
; polling, and NodeLink out to its own secondaries.
;
; SINGLE CORE: Shelly polling and each NodeLink client are pinned to core 0 and
; share it with loop(). Fine with one node; several nodes is UNMEASURED, and this
; is the first place to look if the web UI goes sluggish.
;
; Needs the "ffat"-labelled LittleFS partition for the Angular bundle, which the
; node's huge_app.csv hasn't got — hence its own table.
; -----------------------------------------------------------------------------
[env:xiao_c5_primary]
board_build.partitions = partitions-xiao-c5-primary.csv
build_flags =
    -DBOARD_XIAO_C5
    -DENABLE_SERVO
    -DARDUINO_USB_CDC_ON_BOOT=1
; Inherits [env]'s build_src_filter — the full sketch, minus node/ and bench/.

; -----------------------------------------------------------------------------
; SECONDARY NODE — a dumb actuator bank. A different PROGRAM, not a flavour of
; the main sketch: this env inverts build_src_filter to compile
; firmware/node/dustgate_node.cpp instead of firmware.ino. It shares the headers
; that matter (ServoActuator, NodeLink, WiFiProvisioner) and skips everything
; else — see the rationale at the top of dustgate_node.cpp.
;
; huge_app: no OTA, ~3 MB app, and no Angular bundle to store (a node's whole
; interface is the /nodelink WebSocket).
; -----------------------------------------------------------------------------
[env:xiao_c5]
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_XIAO_C5
    -DENABLE_SERVO
    -DDUSTGATE_SECONDARY
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<node/>

; -----------------------------------------------------------------------------
; THE SLIDER, AS A PRIMARY — the routing brain, on the board that drives the rack.
;
; Everything xiao_c5_primary is (topology, REST API, the Angular bundle, Shelly
; polling, NodeLink out to secondaries, the OLED) with the four PWM channels
; traded for one ST3215 on a serial bus. -DDUSTGATE_SERVO_BUS is what makes that
; trade: the board header presents the bus pins and the endstops instead of the
; servo block, HAS_LINEAR goes to 1, and the sketch takes ST3215LinearDriver +
; LimitSwitchDistance instead of the null pair.
;
; NO -DENABLE_SERVO, and that is not an oversight. PWM and serial never share a
; board — the slider gets dedicated hardware riding with it — and config.h
; #errors if a pin map ever claims both.
;
; A one-slider shop is a legitimate whole shop, which is why this exists as a
; primary at all and not only as a node.
; -----------------------------------------------------------------------------
[env:xiao_c5_linear_primary]
board_build.partitions = partitions-xiao-c5-primary.csv
build_flags =
    -DBOARD_XIAO_C5
    -DDUSTGATE_SERVO_BUS
    -DARDUINO_USB_CDC_ON_BOOT=1
; The default filter excludes motor/st3215/ so the PWM builds don't carry a bus
; driver they can't use. Add it back — this is the one primary that needs it.
build_src_filter = +<*> -<test/> -<node/> -<bench/>

; -----------------------------------------------------------------------------
; THE SLIDER, AS A NODE — a rack at the far end of a NodeLink socket.
;
; The same actuator, reached the other way: a primary somewhere else in the shop
; resolves a gate to an absolute mm position and sends it, and this board turns
; that into counts. Its dedicated 12V supply is at the gate, so the bus stays
; ~0.3m no matter where the brain lives.
;
; THIS NODE HAS A BRAIN, and it is the first one that does. CLAUDE.md's rule is
; that a secondary gets already-resolved numbers and never decides anything —
; still true of MOVES. But a homing sweep is a closed loop between an endstop and
; a servo that cannot round-trip per step over WiFi, so calibration is local.
; See the CALIBRATION note in node/dustgate_node.cpp.
; -----------------------------------------------------------------------------
[env:xiao_c5_linear]
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_XIAO_C5
    -DDUSTGATE_SERVO_BUS
    -DDUSTGATE_SECONDARY
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<node/> +<motor/st3215/> +<feedback/>

; -----------------------------------------------------------------------------
; BENCH — one ST3215 serial bus servo, and nothing else.
;
; Not a DustGate role. It is a serial console for first contact with a bus servo:
; scan, ping, move, stop, read the encoder. No WiFi, no topology, no gate — so a
; first-contact bug is a bug in one screenful of code.
;
; -DDUSTGATE_SERVO_BUS swaps the board's PWM block for PIN_SERVO_BUS_TX/RX
; (boards/xiao_c5.h), which is what makes this the only env where HAS_LINEAR is
; 1. config.h #errors if a board ever claims both: PWM and serial never share a
; board.
;
; Read firmware/wiring/st3215-bench.md before connecting the signal wire — the
; bus logic level is unconfirmed and this part is not 5V tolerant.
;
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run -e xiao_c5_bus_bench -t upload
; -----------------------------------------------------------------------------
[env:xiao_c5_bus_bench]
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_XIAO_C5
    -DDUSTGATE_SERVO_BUS
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<bench/> +<motor/st3215/>
