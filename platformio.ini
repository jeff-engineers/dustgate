; =============================================================================
; PlatformIO project configuration
; Primary target: Espressif ESP32-DevKitC (WROOM-32), servo-only → env esp32dev_servo
; Rack variant:   the same DevKitC + TMC2209 + linear rail     → env esp32dev_wroom32
; Legacy variant:  Adafruit ESP32-S2 Feather + TMC2209 (#6121)  → env adafruit_feather_esp32s2
; The board pin map is chosen by the -DBOARD_* flag in each env; see
; firmware/boards/*.h and config.h.
; =============================================================================

[platformio]
src_dir   = firmware
data_dir  = firmware/data
; Default to the primary target when no -e is given. Servo-only: a master's job
; is the routing brain, and the linear rack is one kind of gate rather than a
; requirement — build esp32dev_wroom32 for a board that has one.
default_envs = esp32dev_servo
; Keep build output and library deps in .nosync directories so macOS iCloud
; Drive ignores them entirely. iCloud blocks small rapid writes (GCC .d dep
; files, SCons .sconsign tmp files) on synced folders in the project path.
build_dir   = .pio.nosync/build
libdeps_dir = .pio.nosync/libdeps

; -----------------------------------------------------------------------------
; Shared across all board environments (PlatformIO applies [env] to every
; [env:NAME]). Only board + build_flags differ per target, below.
; -----------------------------------------------------------------------------
[env]
; PINNED, and it has to stay pinned. This was a bare `espressif32` until the
; xiao_c5 spike (bottom of this file) installed the pioarduino fork, which
; publishes under the SAME platform name — so the unpinned spec silently
; retargeted every board here from Arduino core 2.0.x to 3.x, and the whole
; build broke on ESP32Servo 1.x calling ledcSetup()/ledcAttachPin(), which core
; 3 removed. An explicit version keeps the two platforms in separate directories
; and makes which core each env gets a decision rather than an accident.
;
; 6.x is the line matching the core-2.0.x lib_deps below. Moving off it is the
; migration described in the xiao_c5 env — do it deliberately, all envs at once.
platform  = espressif32@^6.9.0
framework = arduino

; Serial monitor — matches SERIAL_BAUD in config.h
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; Libraries
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    waspinator/AccelStepper@^1.64
    bblanchon/ArduinoJson@^6.21.0
    me-no-dev/AsyncTCP@^1.1.1
    ; Phase-2 positional-servo control (ball-valve gates). 1.x line matches the
    ; Arduino-ESP32 2.0.x core; only compiled where -DENABLE_SERVO is set.
    madhephaestus/ESP32Servo@^1.1.1
    ; Re-resolves/reinstalls on every single build (harmless but slow — its
    ; own manifest names it "ESP Async WebServer", which mismatches this
    ; registry shorthand). Tried pinning by git URL instead, but the repo's
    ; only available ref is master HEAD, which has moved to an incompatible
    ; v3.x rewrite with a different AsyncTCP dependency — not worth the
    ; regression risk to fix a cosmetic slowdown. Leaving as-is.
    me-no-dev/ESPAsyncWebServer@^1.2.3
    ; Phase-3 NodeLink transport. ESPAsyncWebServer is server-ONLY; the primary
    ; needs a WebSocket CLIENT to dial out to each secondary board. Only used by
    ; control/RemoteActuatorBus.
    links2004/WebSockets@^2.4.1

; LittleFS — Angular front-end bundle stored in firmware/data/
; Build bundle first:  cd dustgate-ui && bash deploy.sh
; Then upload to ESP32: pio run --target uploadfs
board_build.filesystem = littlefs

; Exclude the Arduino IDE unity-build shim — PlatformIO finds subdirectory
; sources automatically, so including sources.cpp would compile everything twice.
; Also exclude test/ — those are HOST conformance tests built with g++ (each has its
; own main()), so sweeping them into the device build breaks the link on duplicate
; main. Run them with the tools/ scripts, not pio.
; Also exclude node/ — that's the SEPARATE secondary-node program (its own
; setup()/loop(); see firmware/node/dustgate_node.cpp). The
; dustgate_node env below inverts this filter to build that instead.
build_src_filter = +<*> -<sources.cpp> -<test/> -<node/>

; Extra script: serialises the build + clears dep-file flags to fix
; "opening dependency file: No such file or directory" on first builds.
extra_scripts = pre:extra_script.py

; belt-and-suspenders: also remove -MMD from any flag list where it appears
build_unflags = -MMD

; -----------------------------------------------------------------------------
; DEFAULT PRIMARY — ESP32-DevKitC (classic WROOM-32), SERVO-ONLY.
;
; "Is a stepper fitted?" is answered HERE, by which env you flash — it is a
; build-time fact, not a runtime one:
;
;   pio run -e esp32dev_servo   -t upload    # no rack (default)
;   pio run -e esp32dev_wroom32 -t upload    # rack fitted
;
; Same board and the same pin map — the ONLY difference is -DNO_LINEAR_FITTED,
; which tells the sketch not to treat an absent TMC2209 as a fault. The UART
; health check still runs and still prints; what changes is that the board no
; longer sits in STATE_ERROR with the pixel pulsing red about a stepper you chose
; not to fit. Motion stays disabled. See the NO_LINEAR_FITTED block in config.h.
;
; NOTE this is the deliberately small version. The right seam is HAS_LINEAR,
; which config.h derives from the pin map and which nothing currently reads —
; making it load-bearing would compile the stepper out entirely and reclaim its
; flash, but it touches motion code that has never run on hardware. Logged in
; TODO.md; do it before the serial-servo migration, not during a bench session.
; -----------------------------------------------------------------------------
[env:esp32dev_servo]
board      = esp32dev
board_build.partitions = partitions-devkitc-noota.csv
build_flags = -DBOARD_DEVKITC -DENABLE_SERVO -DNO_LINEAR_FITTED
; Same CP2102 notes as the rack variant below.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200

; -----------------------------------------------------------------------------
; PRIMARY WITH A STATUS SCREEN — the same DevKitC and the same pin map as
; esp32dev_servo, plus an SSD1306 on I²C.
;
;   pio run -e esp32dev_screen -t upload
;
; UNVERIFIED: this env compiles and nothing more. No display has been connected
; to a DustGate board, so flashing it is a bench experiment, not a supported
; configuration — and on a board with no panel wired it is harmless, because
; StatusScreen::begin() gets no ACK, says so on serial, and disables itself.
;
; "Is a screen fitted?" is answered HERE, by which env you flash, exactly like
; "is a stepper fitted?" above. -DHAS_STATUS_SCREEN is what turns the
; PIN_OLED_* block in boards/devkitc_wroom32.h on; the pins themselves stay the
; board header's business. That was the open question in
; docs/mockups/oled-status.html — declare by build, don't probe at boot —
; settled the way the rest of this firmware settles it.
;
; The two Adafruit libraries are why this is a separate env rather than a flag
; on the default one: a DustGate ships without a screen, and a board that has no
; panel should not download, compile or store a display driver. ${env.lib_deps}
; EXTENDS the shared list rather than replacing it (which is what xiao_c5 below
; does deliberately) — drop the interpolation and this env silently loses
; ArduinoJson and the web server.
;
; NOTE the DevKitC has no spares left after this: GPIO16 and 4 were its last two.
; -----------------------------------------------------------------------------
[env:esp32dev_screen]
board      = esp32dev
board_build.partitions = partitions-devkitc-noota.csv
build_flags = -DBOARD_DEVKITC -DENABLE_SERVO -DNO_LINEAR_FITTED -DHAS_STATUS_SCREEN
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
; Same CP2102 notes as the rack variant below.
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200

; -----------------------------------------------------------------------------
; Rack variant — the same DevKitC with a TMC2209 + linear rail fitted.
; Dual-core, no native USB (onboard CP2102/CH340), so USB_CDC_ON_BOOT is NOT set.
; Flashing this onto a board with no driver attached boots fine but sits in
; STATE_ERROR with a permanently red pixel — use esp32dev_servo instead.
; -----------------------------------------------------------------------------
[env:esp32dev_wroom32]
board      = esp32dev
; Custom no-OTA table: reclaims the stock esp32dev layout's second OTA slot for a
; single big app + a 2.19 MB LittleFS "ffat" partition (the stock table labels FS
; "spiffs", which LittleFS.begin(...,"ffat") would fail to mount). See the CSV.
board_build.partitions = partitions-devkitc-noota.csv
; ENABLE_SERVO turns on the Phase-2 servo bring-up (serial `servo <1-4> <angle>`
; on the reserved PWM pins 25/26/27/14). Servos run off an EXTERNAL 5–6V rail.
build_flags = -DBOARD_DEVKITC -DENABLE_SERVO
; The DevKitC's CP2102 auto-reset circuit (DTR→GPIO0, RTS→EN) otherwise drops the
; board into download mode ("waiting for download") the moment the host opens the
; serial port. Hold both lines deasserted so opening the monitor doesn't reset /
; bootloader the board; tap the on-board EN button to capture the boot log.
monitor_dtr = 0
monitor_rts = 0
; PlatformIO defaults esp32dev to 460800, which this board does not survive.
; Verified on hardware 2026-08-12: the bootloader, partition table and otadata
; all write and verify at 460800 — they are only a few KB each — and then the
; 1.3 MB app image dies a few percent in with "The chip stopped responding".
; The partial success is what makes it misleading; it reads like a flash or
; partition fault rather than a baud one. 115200 flashes reliably. Slower
; (~2 min vs ~20 s), which is worth it to never debug this twice.
upload_speed = 115200

; -----------------------------------------------------------------------------
; Legacy variant — Adafruit ESP32-S2 Feather. Unadvertised, kept building.
; ESP32-S2 uses native USB CDC for Serial; the flag enables it on boot,
; matching the Arduino IDE board default.
; -----------------------------------------------------------------------------
[env:adafruit_feather_esp32s2]
board      = adafruit_feather_esp32s2
build_flags =
    -DBOARD_FEATHER_S2
    -DARDUINO_USB_CDC_ON_BOOT=1

; -----------------------------------------------------------------------------
; SECONDARY NODE — Adafruit QT Py ESP32-S3 (N4R2), servo-only. THE DEFAULT NODE.
;
; A different PROGRAM, not a different flavour of the main sketch: this env
; inverts build_src_filter to compile firmware/node/dustgate_node.cpp
; instead of firmware.ino. It shares the headers that matter
; (ServoActuator, NodeLink, WiFiProvisioner) and skips everything else — see the
; rationale at the top of dustgate_node.cpp.
;
; huge_app: no OTA, ~3MB app, and no Angular bundle to store (a node's whole
; interface is the /nodelink WebSocket), which is what makes a 4MB board enough.
;
; BOARD ID: adafruit_qtpy_esp32s3_n4r2 = the 4MB-flash / 2MB-PSRAM part, verified
; on the bench with `esptool.py flash_id`. If you buy the OTHER QT Py S3 (the
; 8MB no-PSRAM Adafruit 5426) switch `board` to adafruit_qtpy_esp32s3_nopsram —
; the pin map in boards/qtpy_s3.h is identical, only flash geometry differs.
; Flashing the wrong id fails loudly at connect ("This chip is ESP32-S3, not
; ESP32-C3" or a flash-size mismatch), so a mix-up can't silently brick a board.
; -----------------------------------------------------------------------------
[env:dustgate_node]
board      = adafruit_qtpy_esp32s3_n4r2
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_QTPY_S3
    -DENABLE_SERVO
    -DDUSTGATE_SECONDARY
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<node/>
; The INVERSE of the DevKitC's monitor_dtr/rts = 0, and it must stay that way.
; There is no auto-reset circuit here (USB comes straight off the MCU), so these
; lines are pure CDC line state — and TinyUSB reports the port connected only
; while DTR is asserted, with USBCDC::write() silently discarding every byte when
; it isn't. Set these to 0 and the node compiles, boots, joins WiFi and prints
; NOTHING, which reads exactly like a dead board.
; This is also why dev.sh always passes -e: without it pio applies default_envs'
; (the DevKitC's) monitor settings to whatever is plugged in.
monitor_dtr = 1
monitor_rts = 1

; -----------------------------------------------------------------------------
; SECONDARY NODE (alt) — Seeed Studio XIAO ESP32C5, servo-only.
;
; A supported node target as of 2026-08-14, no longer a spike: flashed, booted,
; WiFi joined, ready at ~2s — and as of 2026-08-21 all four PWM channels have
; driven real servos (see firmware/wiring/xiao-c5.md). Deliberately servo-only — single core, and
; step generation is the one workload that hates CPU contention; servos don't.
;
; IT RIDES A DIFFERENT PLATFORM, and that used to be the whole cost of the board:
;
;   - Official `platform = espressif32` has no ESP32-C5. New Espressif parts
;     (C5/C6/H2/P4) land only in the pioarduino fork, which is what Seeed's own
;     PlatformIO guide points at. Hence the platform URL below.
;   - The fork ships Arduino core 3.x / IDF 5.x. The [env] lib_deps above are
;     pinned to the core-2.0.x era ON PURPOSE (see the comments there), and three
;     of them do not survive the jump — so this env replaces lib_deps wholesale
;     rather than extending it:
;       * me-no-dev/AsyncTCP + ESPAsyncWebServer -> the maintained ESP32Async
;         forks. This is the migration the [env] comment declined to make for
;         regression-risk reasons; the C5 forces it.
;       * ESP32Servo 1.x -> 3.x (1.x is the core-2.0.x line, as noted above).
;       * TMCStepper/AccelStepper are dropped entirely — servo-only build.
;
; THE TWO PLATFORMS NO LONGER SHARE A DIRECTORY. They publish packages under the
; same names — `framework-arduinoespressif32`, `toolchain-riscv32-esp` — into one
; core dir, and overwrote each other in two different ways, neither of which
; PlatformIO detects or repairs (opaque SCons TypeError; a half-deleted toolchain
; that `pio pkg install` calls up-to-date). So this env gets its own
; PLATFORMIO_CORE_DIR and the installations never meet.
;
; dev.sh / deploy.sh set it for you — use_core_for_env() in tools/boardinfo.sh,
; called before every build and before the monitor. Building by hand needs it
; too, and this is now the ONLY way to build this env correctly:
;
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run -e xiao_c5
;
; Set DUSTGATE_FORK_CORE_DIR to put it somewhere else (7.6 GB measured). A bare
; `pio run -e xiao_c5` with no core dir set will try to install the fork over the
; official installation — the old breakage, now the only way to reach it.
;
; Mixing envs in one command is still wrong, but it is now a mistake with a clear
; failure rather than a trap: one pio process has one core dir.
;
;   pio run -e xiao_c5                       # ok, with the core dir set
;   pio run -e dustgate_node -e xiao_c5      # no: they need different core dirs
;
; A bare `pio run` is safe: [platformio] default_envs above pins it to the
; primary target only, and .github/workflows/ci.yml lists the supported envs
; explicitly. Neither picks up this env.
;
; The remaining question this board raises is whether the whole fleet should move
; onto pioarduino / core 3.x — one platform, one core, no isolation. That is a
; decision, not a cleanup: it re-validates every existing target. Isolation buys
; the time to make it deliberately. See TODO.md §0.5.
[env:xiao_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = seeed_xiao_esp32c5
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DBOARD_XIAO_C5
    -DENABLE_SERVO
    -DDUSTGATE_SECONDARY
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<node/>
; USB Serial/JTAG, like the C3 node and UNLIKE the TinyUSB S3/S2 — the lines are
; the ROM's download-mode trigger here, so asserting them drops the board into
; the bootloader. That is the whole "the C5 won't boot" scare of 2026-08-13: the
; board was booting fine every time and the monitor was taking it out of the app
; before it could say so. Confirmed by reading the port with the lines held low —
; full boot log, WiFi joined, ready at 1986 ms. Hold both LOW.
monitor_dtr = 0
monitor_rts = 0

; -----------------------------------------------------------------------------
; SECONDARY NODE + STATUS SCREEN — XIAO ESP32C5 with an SSD1306 on D4/D5.
;
;   PLATFORMIO_CORE_DIR=~/.platformio-pioarduino pio run -e xiao_c5_screen
;
; Everything the xiao_c5 env says applies here — the platform fork, the isolated
; core dir, the wholesale lib_deps replacement — plus -DHAS_STATUS_SCREEN and the
; two Adafruit display libraries.
;
; UNTESTED ON THIS BOARD. A panel works on the DevKitC (2026-08-21), which proves
; the firmware path but says nothing about D4/D5: those are Seeed's published
; convention, not a measurement. The DevKitC took a swapped SDA/SCL to get going,
; and a swap scans exactly like a dead module — so on first light, run `i2c` and
; then `i2c 24 23` before suspecting anything else.
;
; The Adafruit libraries resolve against Arduino core 3.x here rather than the
; 2.0.x line the DevKitC uses. They are core-agnostic (GFX is pure drawing, the
; SSD1306 driver only needs Wire), so this is expected to be uneventful — but it
; is a different resolution than esp32dev_screen gets, which is why this env
; exists rather than a flag on xiao_c5.
; -----------------------------------------------------------------------------
[env:xiao_c5_screen]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = seeed_xiao_esp32c5
board_build.partitions = huge_app.csv
lib_deps =
    ${env:xiao_c5.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    ${env:xiao_c5.build_flags}
    -DHAS_STATUS_SCREEN
build_src_filter = -<*> +<node/>
monitor_dtr = 0
monitor_rts = 0
